name: chat_app
description: "A new Flutter project."
publish_to: 'none' # لمنع نشر الباكدج على pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  modal_progress_hud_nsn: ^0.5.1
  cloud_firestore: ^6.1.1
  device_preview: ^1.3.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts: 
    - family: pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
